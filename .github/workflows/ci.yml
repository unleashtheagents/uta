name: ci

# Guards main and every pull request:
#   lint          gofmt, go vet, staticcheck, govulncheck, go mod tidy drift
#   test          unit + e2e on Linux and macOS (pure Go, CGO_ENABLED=0), coverage summary
#   test-windows  same suite on Windows (required)
#   race          unit tests under the race detector on Linux
#   build         the full goreleaser matrix as a snapshot (darwin/linux/windows x amd64/arm64),
#                 smoke-tested, uploaded as artifacts, plus the container image build
# Tagged releases are cut by release.yml.

on:
  push:
    branches: [main]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          # Latest stable patch release, not the go.mod floor: govulncheck
          # flags stdlib CVEs fixed in newer patch releases, and users get
          # the same toolchain goreleaser builds with.
          go-version: stable
          check-latest: true
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needed on:" && echo "$out" && exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: go mod tidy drift
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum || { echo "go mod tidy changed go.mod/go.sum; commit the result"; exit 1; }

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          # Latest stable patch release, not the go.mod floor: govulncheck
          # flags stdlib CVEs fixed in newer patch releases, and users get
          # the same toolchain goreleaser builds with.
          go-version: stable
          check-latest: true
      - name: unit tests (with coverage)
        run: go test -count=1 -coverprofile=coverage.out -covermode=atomic ./...
        env:
          UTA_HOME: ${{ runner.temp }}/uta-home
      - name: coverage summary
        shell: bash
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}')
          echo "### Coverage (${{ matrix.os }}): $total" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | sort -k3 -n | awk 'NR<=15' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
          retention-days: 14
      - name: e2e (real binary, stub provider)
        run: go test -count=1 -tags e2e ./tests/e2e/
        env:
          UTA_HOME: ${{ runner.temp }}/uta-home-e2e
      - name: binary smoke
        shell: bash
        run: |
          # No provider CLIs and no real key on the runner: everything below
          # is offline. The dummy key only makes the nebius provider "available"
          # so the shell and the model catalog can be exercised without a call.
          go build -o ./uta-ci ./cmd/uta
          export UTA_HOME="${{ runner.temp }}/uta-smoke" NEBIUS_API_KEY=ci-dummy-not-a-real-key
          ./uta-ci --version
          ./uta-ci --help >/dev/null
          ./uta-ci doctor || echo "doctor exit $? (no agent CLIs on the runner, expected)"
          ./uta-ci permissions status
          ./uta-ci permissions init && ./uta-ci permissions status > perms.txt && grep -q 'deny' perms.txt
          ./uta-ci nebius models > models.txt && grep -q 'Nemotron' models.txt
          ./uta-ci nebius route "add a test for internal/paths" >/dev/null
          set +e
          printf '/status\n/direct\n/status\n/help\n/permissions\nexit\n' | ./uta-ci shell --worker nebius > shell.txt 2> shell.err
          rc=$?
          set -e
          echo "--- shell exit $rc"; cat shell.err; echo "--- stdout"; cat shell.txt
          [ "$rc" -eq 0 ]
          grep -q 'direct (one worker' shell.txt
          # (never `cmd | grep -q` under pipefail: grep exits early and SIGPIPEs the producer)
          ./uta-ci undo --list > undo.txt 2>&1 || true
          grep -qi 'no file changes' undo.txt

  test-windows:
    # Required. Shell-based paths (run_command, hooks, verify) use the sh that
    # Git for Windows puts on PATH; POSIX file-mode assertions are skipped.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          # Latest stable patch release, not the go.mod floor: govulncheck
          # flags stdlib CVEs fixed in newer patch releases, and users get
          # the same toolchain goreleaser builds with.
          go-version: stable
          check-latest: true
      - name: build
        run: go build ./...
      - name: unit tests
        run: go test -count=1 ./...
        env:
          UTA_HOME: ${{ runner.temp }}\uta-home
      - name: e2e (real binary, stub provider)
        run: go test -count=1 -tags e2e ./tests/e2e/
        env:
          UTA_HOME: ${{ runner.temp }}\uta-home-e2e

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          # Latest stable patch release, not the go.mod floor: govulncheck
          # flags stdlib CVEs fixed in newer patch releases, and users get
          # the same toolchain goreleaser builds with.
          go-version: stable
          check-latest: true
      - name: unit tests under the race detector
        run: go test -count=1 -race ./internal/...
        env:
          CGO_ENABLED: "1"
          UTA_HOME: ${{ runner.temp }}/uta-home-race

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          # Latest stable patch release, not the go.mod floor: govulncheck
          # flags stdlib CVEs fixed in newer patch releases, and users get
          # the same toolchain goreleaser builds with.
          go-version: stable
          check-latest: true
      - name: goreleaser snapshot (full matrix, no publish)
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
      - name: smoke the linux/amd64 artifact
        run: |
          bin=$(find dist -type f -path '*linux_amd64*' -name uta | head -1)
          "$bin" --version
          UTA_HOME="${{ runner.temp }}/uta-dist" "$bin" permissions status
          ls -la dist/*.tar.gz dist/*.zip dist/checksums.txt
          echo "### Release matrix" >> "$GITHUB_STEP_SUMMARY"
          (cd dist && ls -1 *.tar.gz *.zip | sed 's/^/- /') >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: uta-snapshot-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          retention-days: 7
      - name: container image (build only)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: uta:ci
      - name: container smoke
        run: |
          docker run --rm uta:ci --version
          docker run --rm uta:ci permissions status
