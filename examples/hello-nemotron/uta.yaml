version: 1
goal: "Hello World multi-model showcase across NVIDIA Nemotron 3 Ultra, Super, Nano, and Lightning on Nebius Token Factory"
strategy: fanout

defaults:
  worker: nebius
  planner: nebius
  max_parallel: 4
  timeout: 2m

synthesis:
  worker: nebius
  mode: merge
  compact_over: 1200   # Nemotron 3 Nano compacts any worker output longer than this before Ultra synthesizes

env:
  UTA_NEBIUS_INJECT_RULES: "1"

subtasks:
  - id: s1_ultra_architect
    title: "Nemotron 3 Ultra (550B/55B MoE) — Architecture Greeting"
    worker: nebius
    prompt: "[model:ultra] Inspect @examples/hello-nemotron/greeter.go and write a 1-sentence architectural greeting from NVIDIA Nemotron 3 Ultra (550B/55B MoE) explaining its 10% Planner & Synthesizer role."

  - id: s2_super_worker
    title: "Nemotron 3 Super (120B/12B MoE) — Parallel Worker Greeting"
    worker: nebius
    prompt: "[model:super] Write a 1-sentence greeting from NVIDIA Nemotron 3 Super (120B/12B MoE) explaining how it executes 90% of parallel coding subtasks on Nebius Token Factory."

  - id: s3_nano_summarizer
    title: "Nemotron 3 Nano (30B/3B MoE) — Fast Summarizer Greeting"
    worker: nebius
    prompt: "[model:nano] Write a 1-sentence greeting from NVIDIA Nemotron 3 Nano (30B/3B MoE) explaining how it handles high-speed context compaction and commit synthesis."

  - id: s4_lightning_sentinel
    title: "Nemotron 3.5 Lightning (30B/3.5B) — Sentinel Guardrail Greeting"
    worker: nebius
    prompt: "[model:lightning] Write a 1-sentence greeting from NVIDIA Nemotron 3.5 Lightning explaining how it screens every tool call with a ~300 ms OWASP ASI01-ASI10 PASS/FAIL verdict before it executes."
